<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bad Ideas for Bad Television Shows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  
  <style>
    @page {
      size: 12in 18in;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 12in;
      height: 18in;
      background-color: #0b0c10;
      color: #f4f4f6;
      font-family: 'Space Grotesk', sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1in;
      -webkit-print-color-adjust: exact;
    }

    /* Subtle CRT Scanline / Noise Background Effect */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Header Section */
    .header {
      z-index: 2;
      border-bottom: 2px solid #2a2d34;
      padding-bottom: 0.3in;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .presenter {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18pt;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff3366;
    }

    .meta-tag {
      font-size: 12pt;
      letter-spacing: 2px;
      color: #666d7d;
      text-transform: uppercase;
    }

    /* Center Title Section */
    .main-section {
      z-index: 2;
      margin: 0.4in 0;
    }

    .playwright {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20pt;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #00f0ff;
      margin-bottom: 0.2in;
      display: inline-block;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 88pt;
      line-height: 0.85;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: -2px;
      text-shadow: -3px 3px 0px #ff3366;
      margin-bottom: 0.4in;
    }

    .title span {
      color: #ff3366;
      text-shadow: -3px 3px 0px #00f0ff;
    }

    /* Decorative TV Bars Accent */
    .tv-bars {
      display: flex;
      height: 12px;
      width: 100%;
      margin-top: 0.3in;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-1 { background: #ffffff; width: 14%; }
    .bar-2 { background: #ffff00; width: 14%; }
    .bar-3 { background: #00ffff; width: 14%; }
    .bar-4 { background: #00ff00; width: 14%; }
    .bar-5 { background: #ff00ff; width: 14%; }
    .bar-6 { background: #ff0000; width: 14%; }
    .bar-7 { background: #0000ff; width: 16%; }

    /* Showtimes / Footer Block */
    .footer {
      z-index: 2;
      background-color: #14161d;
      border: 2px solid #2a2d34;
      border-left: 8px solid #00f0ff;
      padding: 0.4in 0.5in;
      border-radius: 4px;
    }

    .footer-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24pt;
      letter-spacing: 2px;
      color: #8a93a5;
      text-transform: uppercase;
      margin-bottom: 0.15in;
    }

    .showtimes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.15in;
    }

    .showtimes-list li {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24pt;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #2a2d34;
      padding-bottom: 0.1in;
    }

    .showtimes-list li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .showtimes-list li .date {
      color: #ffffff;
    }

    .showtimes-list li .time {
      color: #00f0ff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28pt;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="presenter">Westridge Theatre Presents</div>
    <div class="meta-tag">Live On Stage</div>
  </div>

  <div class="main-section">
    <div class="playwright">A Play By Don Zolidis</div>
    <h1 class="title">Bad<br>Ideas<br>for <span>Bad</span><br>Television<br>Shows</h1>
    
    <div class="tv-bars">
      <div class="bar-1"></div>
      <div class="bar-2"></div>
      <div class="bar-3"></div>
      <div class="bar-4"></div>
      <div class="bar-5"></div>
      <div class="bar-6"></div>
      <div class="bar-7"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-label">Performance Schedule</div>
    <ul class="showtimes-list">
      <li>
        <span class="date">Saturday, November 14</span>
        <span class="time">@ 2 PM</span>
      </li>
      <li>
        <span class="date">Monday, November 16</span>
        <span class="time">@ 7 PM</span>
      </li>
      <li>
        <span class="date">Tuesday, November 17</span>
        <span class="time">@ 7 PM</span>
      </li>
    </ul>
  </div>

</body>
</html>
