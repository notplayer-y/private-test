function handleAppFileUpload(input) {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('custom-app-code').value = e.target.result;
    switchCreatorTab('code');
  };
  reader.readAsText(file);
}

function createCustomApp() {
  const name = document.getElementById('custom-app-name').value.trim();
  const icon = document.getElementById('custom-app-icon').value.trim() || 'https://iili.io/fiufO2p.png';
  const code = document.getElementById('custom-app-code').value.trim();
  
  if (!name) {
    alert('Please enter an app name');
    return;
  }
  
  if (!code) {
    alert('Please provide HTML code for your app');
    return;
  }
  
  // Create a unique ID
  const appId = 'custom_' + Date.now();
  
  // Create blob URL from code
  const blob = new Blob([code], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  
  // Add to custom apps
  state.customApps[appId] = {
    title: name,
    icon: icon,
    src: url,
    description: 'Custom app',
    isCustom: true
  };
  
  // Add to all apps
  ALL_APPS[appId] = state.customApps[appId];
  
  saveState();
  closeAppCreator();
  
  // Refresh app store if open
  if (activeWindows['appstore']) {
    const storeBody = activeWindows['appstore'].querySelector('.win-body');
    storeBody.innerHTML = renderAppStore();
  }
  
  // Refresh desktop
  renderDesktop();
  
  alert(`✓ Created app: ${name}`);
}

function spawnWindow(key, isRestore = false) {
  if (!ALL_APPS[key]) return;
  if (ALL_APPS[key]?.devOnly && !isDevUser()) return; // dev-only apps are gated

  if (activeWindows[key]) {
    activeWindows[key].style.display = 'flex';
    activeWindows[key].style.zIndex = ++zIndexCounter;
    setTimeout(() => activeWindows[key].classList.add('visible'), 10);
    renderDock();
    return;
  }

  const app = ALL_APPS[key];
  const win = document.createElement('div');
  win.className = 'window';
  win.dataset.key = key;

  const isMobile = window.innerWidth < 600;
  if (!isRestore && isMobile) {
    win.style.width = '94%';
    win.style.height = '70%';
    win.style.left = '3%';
    win.style.top = '8%';
  } else if (!isRestore) {
    win.style.width = '800px';
    win.style.height = '550px';
    win.style.left = (100 + Object.keys(activeWindows).length * 30) + 'px';
    win.style.top = (80 + Object.keys(activeWindows).length * 30) + 'px';
  }

  win.style.zIndex = ++zIndexCounter;

  let bodyContent = '';
  if (app.src) {
    bodyContent = `<iframe src="${app.src}"></iframe>`;
  } else if (app.type === 'notes') {
    bodyContent = `<textarea id="note-text" class="notes-area" placeholder="Start typing..." oninput="saveState()">${state.notes}</textarea>`;
  } else if (app.type === 'term') {
    bodyContent = `
      <div id="terminal-container" style="background:#0a0a0a; color:#22d3ee; font-family:'SF Mono', Consolas, monospace; padding:20px; height:100%; box-sizing:border-box; font-size:14px; line-height:1.6; display:flex; flex-direction:column;">

<span style="color:#34d399;">OS Terminal v1.0</span>
<span style="color:#94a3b8;">Type 'help' for available commands</span>

</div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0; padding-top:8px;">
          <span style="color:#f472b6;" id="terminal-dir">~</span>
          <span style="color:#38bdf8;">$</span>
          <input type="text" id="terminal-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            style="flex:1; background:transparent; border:none; outline:none; color:#e2e8f0; font-family:inherit; font-size:inherit; caret-color:#22d3ee;"
            onkeydown="handleTerminalKeydown(event)" autofocus>
        </div>
        <style>
          #terminal-output::-webkit-scrollbar { width: 8px; }
          #terminal-output::-webkit-scrollbar-track { background: #1a1a1a; }
          #terminal-output::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        </style>
      </div>`;
    setTimeout(() => {
      const input = document.getElementById('terminal-input');
      if (input) input.focus();
    }, 100);
  } else if (app.type === 'appstore') {
    bodyContent = renderAppStore();
  } else if (app.type === 'settings') {
    bodyContent = renderSettings();
  } else if (app.type === 'photos') {
    bodyContent = renderPhotosApp();
  } else if (app.type === 'weather') {
    bodyContent = renderWeatherApp();
  } else if (app.type === 'calculator') {
    bodyContent = renderCalculatorApp();
  } else if (app.type === 'camera') {
    bodyContent = renderCameraApp();
  }

  win.innerHTML = `
    <div class="resizer resizer-r"></div>
    <div class="resizer resizer-b"></div>
    <div class="resizer resizer-rb"></div>
    <div class="resizer resizer-l"></div>
    <div class="resizer resizer-t"></div>
    <div class="resizer resizer-lt"></div>
    <div class="resizer resizer-rt"></div>
    <div class="resizer resizer-lb"></div>
    <div class="win-head">
      <div class="win-controls">
        <button class="win-btn close" onclick="closeWin('${key}')"></button>
        <button class="win-btn minimize" onclick="minimizeWin('${key}')"></button>
        <button class="win-btn fullscreen" onclick="toggleFullscreen('${key}')"></button>
      </div>
      <span class="win-title">${app.title}</span>
      <div style="width: 62px;"></div>
    </div>
    <div class="win-body">${bodyContent}</div>
  `;

  activeWindows[key] = win;
  initWindowInteractions(win);
  document.body.appendChild(win);

  requestAnimationFrame(() => {
    win.classList.add('visible');
  });

  renderDock();
  saveState();
}

function filterStoreApps(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.store-app-card').forEach(card => {
    const title = (card.querySelector('h3')?.textContent || '').toLowerCase();
    card.style.display = title.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.app-store-section').forEach(section => {
    const cards = section.querySelectorAll('.store-app-card');
    if (cards.length > 0) {
      const allHidden = Array.from(cards).every(c => c.style.display === 'none');
      section.style.display = allHidden ? 'none' : '';
    }
  });
}

function deleteCustomApp(appId) {
  if (!confirm('Are you sure you want to delete this custom app?')) return;
  
  // Close window if open
  if (activeWindows[appId]) {
    closeWin(appId);
  }
  
  // Remove from state
  delete state.customApps[appId];
  delete ALL_APPS[appId];
  
  // Remove from pinned
  state.pinned = state.pinned.filter(id => id !== appId);
  
  saveState();
  
  // Refresh UI
  if (activeWindows['appstore']) {
    const storeBody = activeWindows['appstore'].querySelector('.win-body');
    storeBody.innerHTML = renderAppStore();
  }
  renderDesktop();
  renderDock();
}

function setDockPosition(position) {
  state.dockPosition = position;

  }
  saveState();
  if (activeWindows['settings']) {
    const settingsBody = activeWindows['settings'].querySelector('.win-body');
    settingsBody.innerHTML = renderSettings();
  }
}

function toggleHideTopbarOnFullscreen() {
  state.hideTopbarOnFullscreen = !state.hideTopbarOnFullscreen;
  saveState();
  if (activeWindows['settings']) {
    const settingsBody = activeWindows['settings'].querySelector('.win-body');
    settingsBody.innerHTML = renderSettings();
  }
}

function changeUsername() {
  const newName = prompt('Enter new account name:', state.user?.username || '');
  if (newName && newName.trim()) {
    state.user.username = newName.trim();
    document.getElementById('os-brand').innerText = state.user.username;
    saveState();
    if (activeWindows['settings']) {
      const settingsBody = activeWindows['settings'].querySelector('.win-body');
      settingsBody.innerHTML = renderSettings();
    }
  }
}

// Weather App Functions
function renderWeatherApp() {
  setTimeout(loadWeatherData, 100);
  return `
    <div class="weather-app" id="weather-app">
      <div class="weather-loading">
        <div class="spinner"></div>
        <p>Getting your location...</p>
      </div>
    </div>
  `;
}

async function loadWeatherData() {
  const container = document.getElementById('weather-app');
  if (!container) return;

  container.innerHTML = `
    <div class="weather-loading">
      <div class="spinner"></div>
      <p>Getting weather data...</p>
    </div>
  `;

  try {
    // Get user's location
    let latitude, longitude;

    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          timeout: 10000,
          enableHighAccuracy: false,
          maximumAge: 300000
        });
      });
      latitude = position.coords.latitude;
      longitude = position.coords.longitude;
    } catch (geoError) {
      // If geolocation fails, try IP-based location
      try {
        const ipResponse = await fetch('https://ipapi.co/json/');
        const ipData = await ipResponse.json();
        latitude = ipData.latitude;
        longitude = ipData.longitude;
      } catch {
        throw { code: 1, message: 'Location unavailable' };
      }
    }

    // Fetch weather from Open-Meteo API
    const weatherResponse = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature&temperature_unit=fahrenheit&wind_speed_unit=mph`
    );

    if (!weatherResponse.ok) throw new Error('Weather API error');
    const weatherData = await weatherResponse.json();

    // Try to get location name, but don't fail if it doesn't work
    let city = 'Your Location';
    let country = '';

    try {
      const geoResponse = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`,
        { headers: { 'User-Agent': 'CoinOS Weather App' } }
      );
      if (geoResponse.ok) {
        const geoData = await geoResponse.json();
        city = geoData.address?.city || geoData.address?.town || geoData.address?.village || geoData.address?.county || 'Your Location';
        country = geoData.address?.country || '';
      }
    } catch {
      // Silently fail - we'll just show "Your Location"
    }

    const temp = Math.round(weatherData.current.temperature_2m);
    const feelsLike = Math.round(weatherData.current.apparent_temperature);
    const humidity = weatherData.current.relative_humidity_2m;
    const windSpeed = Math.round(weatherData.current.wind_speed_10m);
    const weatherCode = weatherData.current.weather_code;

    const weatherInfo = {
      0: { desc: 'Clear sky', icon: '☀️' },
      1: { desc: 'Mainly clear', icon: '🌤️' },
      2: { desc: 'Partly cloudy', icon: '⛅' },
      3: { desc: 'Overcast', icon: '☁️' },
      45: { desc: 'Foggy', icon: '🌫️' },
      48: { desc: 'Icy fog', icon: '🌫️' },
      51: { desc: 'Light drizzle', icon: '🌧️' },
      53: { desc: 'Drizzle', icon: '🌧️' },
      55: { desc: 'Dense drizzle', icon: '🌧️' },
      61: { desc: 'Light rain', icon: '🌧️' },
      63: { desc: 'Rain', icon: '🌧️' },
      65: { desc: 'Heavy rain', icon: '🌧️' },
      71: { desc: 'Light snow', icon: '🌨️' },
      73: { desc: 'Snow', icon: '🌨️' },
      75: { desc: 'Heavy snow', icon: '🌨️' },
      80: { desc: 'Rain showers', icon: '🌦️' },
      81: { desc: 'Rain showers', icon: '🌦️' },
      82: { desc: 'Heavy showers', icon: '🌦️' },
      95: { desc: 'Thunderstorm', icon: '⛈️' },
      96: { desc: 'Thunderstorm', icon: '⛈️' },
      99: { desc: 'Severe storm', icon: '⛈️' }
    };

    const weather = weatherInfo[weatherCode] || { desc: 'Unknown', icon: '🌡️' };

    container.innerHTML = `
      <div class="weather-content">
        <div class="weather-icon">${weather.icon}</div>
        <div class="weather-temp">${temp}°F</div>
        <div class="weather-desc">${weather.desc}</div>
        <div class="weather-location">${city}${country ? ', ' + country : ''}</div>
        <div class="weather-details">
          <div class="weather-detail">
            <div class="weather-detail-label">Feels Like</div>
            <div class="weather-detail-value">${feelsLike}°</div>
          </div>
          <div class="weather-detail">
            <div class="weather-detail-label">Humidity</div>
            <div class="weather-detail-value">${humidity}%</div>
          </div>
          <div class="weather-detail">
            <div class="weather-detail-label">Wind</div>
            <div class="weather-detail-value">${windSpeed} mph</div>
          </div>
        </div>
        <button class="weather-refresh" onclick="loadWeatherData()">↻ Refresh</button>
      </div>
    `;
  } catch (error) {
    console.error('Weather error:', error);
    container.innerHTML = `
      <div class="weather-error">
        <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
        <h2 style="margin-bottom: 8px; color: var(--text);">Unable to Load Weather</h2>
        <p style="color: var(--text-secondary); margin-bottom: 16px;">${error.code === 1 ? 'Please enable location access.' : 'Check your internet connection and try again.'}</p>
        <button onclick="loadWeatherData()">Try Again</button>
      </div>
    `;
  }
}

// Calculator App Functions
let calcExpression = '';
let calcResult = '0';
let calcNewNumber = true;

function renderCalculatorApp() {
  calcExpression = '';
  calcResult = '0';
  calcNewNumber = true;

  setTimeout(() => {
    const calcWindow = activeWindows['calculator'];
    if (calcWindow) {
      calcWindow.addEventListener('keydown', handleCalcKeydown);
    }
  }, 100);

  return `
    <div class="calculator-app" id="calculator-app" tabindex="0">
      <div class="calc-display">
        <div class="calc-expression" id="calc-expression"></div>
        <div class="calc-result" id="calc-result">0</div>
      </div>
      <div class="calc-buttons">
        <button class="calc-btn function" onclick="calcClear()">AC</button>
        <button class="calc-btn function" onclick="calcToggleSign()">±</button>
        <button class="calc-btn function" onclick="calcPercent()">%</button>
        <button class="calc-btn operator" onclick="calcOperator('/')">÷</button>

        <button class="calc-btn number" onclick="calcDigit('7')">7</button>
        <button class="calc-btn number" onclick="calcDigit('8')">8</button>
        <button class="calc-btn number" onclick="calcDigit('9')">9</button>
        <button class="calc-btn operator" onclick="calcOperator('*')">×</button>

        <button class="calc-btn number" onclick="calcDigit('4')">4</button>
        <button class="calc-btn number" onclick="calcDigit('5')">5</button>
        <button class="calc-btn number" onclick="calcDigit('6')">6</button>
        <button class="calc-btn operator" onclick="calcOperator('-')">−</button>

        <button class="calc-btn number" onclick="calcDigit('1')">1</button>
        <button class="calc-btn number" onclick="calcDigit('2')">2</button>
        <button class="calc-btn number" onclick="calcDigit('3')">3</button>
        <button class="calc-btn operator" onclick="calcOperator('+')">+</button>

        <button class="calc-btn number wide" onclick="calcDigit('0')">0</button>
        <button class="calc-btn number" onclick="calcDecimal()">.</button>
        <button class="calc-btn equals" onclick="calcEquals()">=</button>
      </div>
    </div>
  `;
}

function handleCalcKeydown(e) {
  if (!activeWindows['calculator'] || activeWindows['calculator'].style.display === 'none') return;

  const key = e.key;

  if (/^[0-9]$/.test(key)) {
    calcDigit(key);
  } else if (key === '.') {
    calcDecimal();
  } else if (key === '+' || key === '-') {
    calcOperator(key);
  } else if (key === '*' || key === 'x' || key === 'X') {
    calcOperator('*');
  } else if (key === '/' || key === '÷') {
    calcOperator('/');
  } else if (key === 'Enter' || key === '=') {
    e.preventDefault();
    calcEquals();
  } else if (key === 'Escape' || key === 'c' || key === 'C') {
    calcClear();
  } else if (key === 'Backspace') {
    calcBackspace();
  } else if (key === '%') {
    calcPercent();
  }
}

function calcDigit(d) {
  if (calcNewNumber) {
    calcResult = d;
    calcNewNumber = false;
  } else {
    if (calcResult === '0' && d !== '.') {
      calcResult = d;
    } else {
      calcResult += d;
    }
  }
  updateCalcDisplay();
}

function calcDecimal() {
  if (calcNewNumber) {
    calcResult = '0.';
    calcNewNumber = false;
  } else if (!calcResult.includes('.')) {
    calcResult += '.';
  }
  updateCalcDisplay();
}

function calcOperator(op) {
  const opSymbols = { '+': ' + ', '-': ' − ', '*': ' × ', '/': ' ÷ ' };
  if (calcExpression && !calcNewNumber) {
    calcEquals();
  }
  calcExpression = calcResult + opSymbols[op];
  calcNewNumber = true;
  updateCalcDisplay();
}

function calcEquals() {
  if (!calcExpression) return;

  try {
    // Parse the expression
    const expr = calcExpression.replace(' + ', '+').replace(' − ', '-').replace(' × ', '*').replace(' ÷ ', '/');
    const fullExpr = expr + calcResult;

    // Evaluate safely
    const result = evaluateExpression(fullExpr);

    // Format result - handle fractions/decimals nicely
    if (Number.isInteger(result)) {
      calcResult = result.toString();
    } else {
      // Round to avoid floating point issues, but keep precision
      const rounded = parseFloat(result.toPrecision(12));
      calcResult = rounded.toString();
    }

    calcExpression = '';
    calcNewNumber = true;
  } catch (e) {
    calcResult = 'Error';
    calcExpression = '';
    calcNewNumber = true;
  }
  updateCalcDisplay();
}

function evaluateExpression(expr) {
  // Safe evaluation for basic math
  const tokens = expr.match(/(\d+\.?\d*|[+\-*/])/g);
  if (!tokens) return 0;

  let result = parseFloat(tokens[0]);

  for (let i = 1; i < tokens.length; i += 2) {
    const operator = tokens[i];
    const operand = parseFloat(tokens[i + 1]);

    switch (operator) {
      case '+': result += operand; break;
      case '-': result -= operand; break;
      case '*': result *= operand; break;
      case '/': result = operand !== 0 ? result / operand : NaN; break;
    }
  }

  return result;
}

function calcClear() {
  calcExpression = '';
  calcResult = '0';
  calcNewNumber = true;
  updateCalcDisplay();
}

function calcBackspace() {
  if (calcResult.length > 1) {
    calcResult = calcResult.slice(0, -1);
  } else {
    calcResult = '0';
    calcNewNumber = true;
  }
  updateCalcDisplay();
}

function calcToggleSign() {
  if (calcResult !== '0') {
    if (calcResult.startsWith('-')) {
      calcResult = calcResult.slice(1);
    } else {
      calcResult = '-' + calcResult;
    }
  }
  updateCalcDisplay();
}

function calcPercent() {
  calcResult = (parseFloat(calcResult) / 100).toString();
  updateCalcDisplay();
}

function updateCalcDisplay() {
  const exprEl = document.getElementById('calc-expression');
  const resultEl = document.getElementById('calc-result');
  if (exprEl) exprEl.textContent = calcExpression;
  if (resultEl) {
    // Format large numbers with commas
    let display = calcResult;
    if (!isNaN(parseFloat(calcResult)) && calcResult !== 'Error') {
      const num = parseFloat(calcResult);
      if (Math.abs(num) >= 1000 && Number.isInteger(num)) {
        display = num.toLocaleString();
      }
    }
    resultEl.textContent = display;
  }
}

  const isGoingFullscreen = !win.classList.contains('fullscreen');

  win.classList.toggle('fullscreen');

  // Handle hide-topbar setting
  if (isGoingFullscreen && state.hideTopbarOnFullscreen) {
    win.classList.add('hide-topbar');
    // Add hover zone for triggering the title bar
    let hoverZone = win.querySelector('.fullscreen-hover-zone');
    if (!hoverZone) {
      hoverZone = document.createElement('div');
      hoverZone.className = 'fullscreen-hover-zone';
      hoverZone.onmouseenter = () => {
        const winHead = win.querySelector('.win-head');
        if (winHead) winHead.classList.add('visible');
      };
      hoverZone.onmouseleave = () => {
        const winHead = win.querySelector('.win-head');
        if (winHead) winHead.classList.remove('visible');
      };
      win.appendChild(hoverZone);
    }
    // Also add hover handlers to the win-head itself
    const winHead = win.querySelector('.win-head');
    winHead.onmouseenter = () => winHead.classList.add('visible');
    winHead.onmouseleave = () => winHead.classList.remove('visible');
  } else {

    if (hoverZone) hoverZone.remove();

function minimizeWin(key) {
  const win = activeWindows[key];
  const wasFullscreen = win.classList.contains('fullscreen');

  // If window was fullscreen, exit fullscreen first
  if (wasFullscreen) {
    win.classList.remove('fullscreen');
    document.getElementById('mainTopbar').classList.remove('hidden');
    document.getElementById('dock').style.display = 'flex';
  }

  const dock = document.getElementById('dock');
  const dockRect = dock.getBoundingClientRect();
  const winRect = win.getBoundingClientRect();

  const dockCenterX = dockRect.left + dockRect.width / 2;
  const dockCenterY = dockRect.top + dockRect.height / 2;

  const translateX = dockCenterX - (winRect.left + winRect.width / 2);
  const translateY = dockCenterY - (winRect.top + winRect.height / 2);

  win.classList.add('minimizing');
  win.style.transform = `translate(${translateX}px, ${translateY}px) scale(0.1)`;
  win.style.opacity = '0';

  setTimeout(() => {
    win.classList.remove('minimizing');
    win.style.transform = '';
    win.style.opacity = '';
    win.style.display = 'none';
    win.classList.remove('visible');
    renderDock();
    updateDockVisibility();
    saveState();
  }, 400);
}

    startDrag(e, win, 'touch');
  };
  // Double-click the title bar toggles maximize / float
  head.ondblclick = (e) => {
    if (e.target.classList.contains('win-btn')) return;
    applySnap(key, win.dataset.snap === 'max' ? 'float' : 'max');
  };

  // Hover the green button for the snap-layout flyout

  if (greenBtn) {

  }

  win.querySelectorAll('.resizer').forEach(r => {

      document.onmousemove = (me) => resize(me, win, r);
      document.onmouseup = () => { document.onmousemove = null; saveState(); };

  });

}

function startDrag(e, win, type) {
  if (win.classList.contains('fullscreen')) return;
  if (type === 'mouse') e.preventDefault();

  const key = win.dataset.key;
  let startX = (type === 'mouse') ? e.clientX : e.touches[0].clientX;
  let startY = (type === 'mouse') ? e.clientY : e.touches[0].clientY;

  // If the window is snapped, restore its floating size and re-grab under the cursor
  if (win.classList.contains('snapped')) {
    const g = win._floatGeom || {};
    const floatW = parseInt(g.width) || 800;
    win.classList.remove('snapped');
    delete win.dataset.snap;
    win.style.width = (g.width || '800px');
    win.style.height = (g.height || '550px');
    win.style.left = (startX - floatW / 2) + 'px';
    win.style.top = (startY - 22) + 'px';
  }

  const initialLeft = win.offsetLeft;
  const initialTop = win.offsetTop;
  let pendingZone = null;

  const moveHandler = (me) => {
    const currentX = (type === 'mouse') ? me.clientX : me.touches[0].clientX;
    const currentY = (type === 'mouse') ? me.clientY : me.touches[0].clientY;

    let newLeft = initialLeft + (currentX - startX);
    let newTop = initialTop + (currentY - startY);

    // Constrain horizontally
    const winWidth = win.offsetWidth;
    if (newLeft < 0) newLeft = 0;
    if (newLeft + winWidth > window.innerWidth) newLeft = window.innerWidth - winWidth;

    // Constrain vertically (topbar boundary removed; only keep on-screen)
    const winHeight = win.offsetHeight;
    if (newTop < 0) newTop = 0;
    if (newTop + winHeight > window.innerHeight) newTop = window.innerHeight - winHeight;

    win.style.left = newLeft + "px";
    win.style.top = newTop + "px";

    // Snap-zone detection & preview
    pendingZone = detectSnapZone(currentX, currentY, win);
    showSnapPreview(pendingZone);
  };

  const endHandler = () => {
    document.removeEventListener(type === 'mouse' ? 'mousemove' : 'touchmove', moveHandler);
    document.removeEventListener(type === 'mouse' ? 'mouseup' : 'touchend', endHandler);
    hideSnapPreview();
    if (pendingZone) applySnap(key, pendingZone);
    else saveState();
  };

  document.addEventListener(type === 'mouse' ? 'mousemove' : 'touchmove', moveHandler, { passive: false });
  document.addEventListener(type === 'mouse' ? 'mouseup' : 'touchend', endHandler);
}

function resize(e, win, r) {
  const dockHeight = 100;
  const minWidth = 280;
  const minHeight = 200;

  const rect = win.getBoundingClientRect();

  // Right edge resize
  if (r.classList.contains('resizer-r') || r.classList.contains('resizer-rb') || r.classList.contains('resizer-rt')) {
    const newWidth = Math.max(minWidth, e.clientX - rect.left);
    win.style.width = newWidth + 'px';
  }

  // Bottom edge resize
  if (r.classList.contains('resizer-b') || r.classList.contains('resizer-rb') || r.classList.contains('resizer-lb')) {
    const maxHeight = window.innerHeight - rect.top - dockHeight;
    const newHeight = Math.min(maxHeight, Math.max(minHeight, e.clientY - rect.top));
    win.style.height = newHeight + 'px';
  }

  // Left edge resize
  if (r.classList.contains('resizer-l') || r.classList.contains('resizer-lt') || r.classList.contains('resizer-lb')) {
    const right = rect.right;
    const newWidth = Math.max(minWidth, right - e.clientX);
    const newLeft = Math.min(e.clientX, right - minWidth);
    win.style.width = newWidth + 'px';
    win.style.left = newLeft + 'px';
  }

  // Top edge resize
  if (r.classList.contains('resizer-t') || r.classList.contains('resizer-lt') || r.classList.contains('resizer-rt')) {
    const bottom = rect.bottom;
    const newHeight = Math.max(minHeight, bottom - e.clientY);
    const newTop = Math.min(e.clientY, bottom - minHeight);
    win.style.height = newHeight + 'px';
    win.style.top = newTop + 'px';
  }
}

function renderDock() {

  // Dynamic icon sizing based on item count (+1 for launcher button)

  d.classList.remove('dock-crowded', 'dock-very-crowded');
  if (total > 14) d.classList.add('dock-very-crowded');
  else if (total > 9) d.classList.add('dock-crowded');

  // Launcher button (always first)
  const launcherBtn = document.createElement('div');
  launcherBtn.className = 'dock-launcher-btn';
  launcherBtn.title = 'Applications';

    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>

  // Separator after launcher

  items.forEach(key => {

function addLongPress(el, callback) {
  let timer;
  const start = (e) => {
    timer = setTimeout(() => callback(e), 500);
  };
  const end = () => clearTimeout(timer);

  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchmove', end);
}

function showAppCtx(e, key) {
  e.preventDefault();
  e.stopPropagation();

  const menu = document.getElementById('ctx-menu');
  const isPinned = state.pinned.includes(key);
  const isDefault = DEFAULT_APPS[key];
  const isCustom = state.customApps[key];

  let menuItems = `<div class="ctx-item" onclick="togglePin('${key}')">${isPinned ? 'Unpin from Dock' : 'Pin to Dock'}</div>`;

  if (!isDefault && (state.downloadedApps.includes(key) || isCustom)) {
    menuItems += `<div class="ctx-separator"></div>`;
    menuItems += `<div class="ctx-item" onclick="uninstallApp('${key}')" style="color: #ef4444;">Uninstall</div>`;
  }

  menu.innerHTML = menuItems;

  let clientX = e.clientX ?? e.changedTouches?.[0]?.clientX ?? 0;
  let clientY = e.clientY ?? e.changedTouches?.[0]?.clientY ?? 0;

  if (clientY > window.innerHeight - 120) clientY -= 100;
  if (clientX + 200 > window.innerWidth) clientX = window.innerWidth - 210;

  menu.style.left = clientX + 'px';
  menu.style.top = clientY + 'px';
  menu.style.display = 'block';

  requestAnimationFrame(() => {
    menu.classList.add('visible');
  });
}

function uninstallApp(key) {
  if (activeWindows[key]) {
    closeWin(key);
  }

  // Check if it's a custom app
  if (state.customApps[key]) {
    deleteCustomApp(key);
    return;
  }

  state.downloadedApps = state.downloadedApps.filter(id => id !== key);
  state.pinned = state.pinned.filter(id => id !== key);
  saveState();

  renderDesktop();
  renderDock();

  if (activeWindows['appstore']) {
    const storeBody = activeWindows['appstore'].querySelector('.win-body');
    storeBody.innerHTML = renderAppStore();
  }

  hideCtx();
}

function togglePin(key) {

    state.pinned = state.pinned.filter(k => k !== key);
  } else {
    state.pinned.push(key);

  saveState();
  renderDock();
  hideCtx();

// Terminal keydown handler
function handleTerminalKeydown(event) {
  const input = document.getElementById('terminal-input');
  const output = document.getElementById('terminal-output');
  const dirDisplay = document.getElementById('terminal-dir');

  if (event.key === 'Enter') {
    const command = input.value;
    const prompt = `<span style="color:#f472b6;">${terminalState.currentDir}</span> <span style="color:#38bdf8;">$</span> `;

    output.innerHTML += `${prompt}<span style="color:#e2e8f0;">${command.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>\n`;

    const result = executeTerminalCommand(command);

    if (result === '__CLEAR__') {
      output.innerHTML = '';
    } else if (result) {
      output.innerHTML += result + '\n';
    }

    output.innerHTML += '\n';
    input.value = '';

    if (dirDisplay) {
      dirDisplay.textContent = terminalState.currentDir;
    }

    output.scrollTop = output.scrollHeight;

  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    if (terminalState.historyIndex > 0) {
      terminalState.historyIndex--;
      input.value = terminalState.history[terminalState.historyIndex] || '';
    }
  } else if (event.key === 'ArrowDown') {
    event.preventDefault();
    if (terminalState.historyIndex < terminalState.history.length - 1) {
      terminalState.historyIndex++;
      input.value = terminalState.history[terminalState.historyIndex] || '';
    } else {
      terminalState.historyIndex = terminalState.history.length;
      input.value = '';
    }
  }
}

function renderLauncherGrid(query) {
  const grid = document.getElementById('launcher-grid');
  if (!grid) return;
  const installed = getInstalledApps();
  const q = (query || '').toLowerCase().trim();

  const entries = Object.entries(installed).filter(([, app]) =>
    !q || app.title.toLowerCase().includes(q)
  );

  if (entries.length === 0) {
    grid.innerHTML = `<div class="launcher-empty">No apps found for "<strong>${q}</strong>"</div>`;
    return;
  }

  grid.innerHTML = entries.map(([key, app]) => `
    <div class="launcher-app" onclick="launcherOpenApp('${key}')" oncontextmenu="launcherAppCtx(event,'${key}')">
      <img src="${app.icon}" alt="${app.title}" onerror="this.src='https://iili.io/fiufO2p.png'">
      <span>${app.title}</span>
    </div>
  `).join('');
}

          REC
        </div>
        <video id="camera-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>
        <canvas id="camera-canvas" style="display:none;"></canvas>
      </div>
      <div class="camera-controls">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <button class="camera-mode-btn ${cameraMode==='photo'?'active':''}" id="mode-photo" onclick="setCameraMode('photo')">PHOTO</button>
          <button class="camera-mode-btn ${cameraMode==='video'?'active':''}" id="mode-video" onclick="setCameraMode('video')">VIDEO</button>
        </div>
        <button class="camera-shutter" id="camera-shutter" onclick="cameraCapture()" title="Take Photo"></button>
        <button class="camera-record-btn" id="camera-record" onclick="toggleVideoRecord()" title="Record Video" style="${cameraMode==='photo'?'display:none':'display:flex'}"></button>
        <div style="width:44px;"></div>
      </div>
    </div>
  `;
}

async function initCameraStream() {
  const video = document.getElementById('camera-video');
  if (!video) return;
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
    video.srcObject = cameraStream;
  } catch (err) {
    const viewfinder = document.getElementById('camera-viewfinder');
    if (viewfinder) viewfinder.innerHTML = `
      <div class="camera-error">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke="#ef4444"/>
        </svg>
        <p style="margin-top:12px;font-size:15px;">Camera access denied</p>
        <p style="font-size:12px;margin-top:6px;opacity:0.6;">Allow camera permissions and reopen</p>
      </div>`;
  }
}

function stopCameraStream() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function setCameraMode(mode) {
  cameraMode = mode;
  const shutter = document.getElementById('camera-shutter');
  const record = document.getElementById('camera-record');
  const photoBtn = document.getElementById('mode-photo');
  const videoBtn = document.getElementById('mode-video');
  if (photoBtn) photoBtn.classList.toggle('active', mode === 'photo');
  if (videoBtn) videoBtn.classList.toggle('active', mode === 'video');
  if (shutter) shutter.style.display = mode === 'photo' ? 'flex' : 'none';
  if (record) record.style.display = mode === 'video' ? 'flex' : 'none';
}

function cameraCapture() {
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('camera-canvas');
  if (!video || !canvas || !cameraStream) return;

  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Flash effect
  const viewfinder = document.getElementById('camera-viewfinder');
  if (viewfinder) {
    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:white;opacity:0.8;transition:opacity 0.3s;z-index:10;pointer-events:none;';
    viewfinder.appendChild(flash);
    setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 300); }, 50);
  }

  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  const timestamp = new Date().toLocaleString().replace(/[/:,\s]/g, '-');
  const photo = { id: Date.now(), name: `Photo-${timestamp}`, data: dataUrl, type: 'image' };

  if (!state.photos) state.photos = [];
  state.photos.unshift(photo);
  saveState();
}

function toggleVideoRecord() {
  const btn = document.getElementById('camera-record');
  const indicator = document.getElementById('rec-indicator');

  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    if (!cameraStream) return;
    recordedChunks = [];
    try {
      mediaRecorder = new MediaRecorder(cameraStream, { mimeType: 'video/webm;codecs=vp9,opus' });
    } catch {
      mediaRecorder = new MediaRecorder(cameraStream);
    }
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const reader = new FileReader();
      reader.onload = (e) => {
        const timestamp = new Date().toLocaleString().replace(/[/:,\s]/g, '-');
        const video = { id: Date.now(), name: `Video-${timestamp}`, data: e.target.result, type: 'video' };
        if (!state.photos) state.photos = [];
        state.photos.unshift(video);
        saveState();
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    if (btn) btn.classList.add('recording');
    if (indicator) indicator.classList.add('visible');
  } else {
    mediaRecorder.stop();
    if (btn) btn.classList.remove('recording');
    if (indicator) indicator.classList.remove('visible');
  }
}

// Camera cleanup is handled inside the main closeWin via key check

// ── Photos App (updated: video + download) ────────────────────
function renderPhotosApp() {
  const photos = state.photos || [];

  const uploadBtn = `
    <div style="display:flex;gap:10px;align-items:center;">
      <label class="photos-upload-btn">
        <input type="file" accept="image/*,video/*" multiple onchange="handlePhotosUpload(this.files)" style="display:none;">
        + Upload
      </label>
    </div>`;

  if (photos.length === 0) {
    return `
      <div class="photos-app">
        <div class="photos-header">
          <h1>Photos</h1>
          ${uploadBtn}
        </div>
        <div class="photos-empty">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21,15 16,10 5,21"/>
          </svg>
          <h2 style="margin:0 0 8px;font-size:20px;color:var(--text);">No photos or videos yet</h2>
          <p style="font-size:14px;margin:0;">Upload files or use the Camera app</p>
        </div>
      </div>`;
  }

  const grid = photos.map((item, index) => {
    const isVideo = item.type === 'video';
    return `
      <div class="photo-item" onclick="viewPhoto(${index})">
        ${isVideo
          ? `<video src="${item.data}" style="width:100%;height:100%;object-fit:cover;" muted></video>
             <div class="video-badge">▶ VIDEO</div>`
          : `<img src="${item.data}" alt="${item.name}">`}
        <div class="photo-item-name">${item.name}</div>
      </div>`;
  }).join('');

  return `
    <div class="photos-app">
      <div class="photos-header">
        <h1>Photos</h1>
        ${uploadBtn}
      </div>
      <div class="photos-grid">${grid}</div>
    </div>`;
}

function handlePhotosUpload(files) {
  const promises = [];
  for (const file of files) {
    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');
    if (!isImage && !isVideo) continue;
    const promise = new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve({
        id: Date.now() + Math.random(),
        name: file.name.replace(/\.[^/.]+$/, ''),
        data: e.target.result,
        type: isVideo ? 'video' : 'image'
      });
      reader.readAsDataURL(file);
    });
    promises.push(promise);
  }
  Promise.all(promises).then((newItems) => {
    if (!state.photos) state.photos = [];
    state.photos.push(...newItems);
    saveState();
    updatePhotosAppUI();
  });
}

function viewPhoto(index) {
  const item = state.photos[index];
  if (!item) return;
  const photosApp = activeWindows['photos'];
  if (!photosApp) return;
  const body = photosApp.querySelector('.win-body');
  const isVideo = item.type === 'video';

  body.innerHTML = `
    <div class="photo-viewer">
      <div class="photo-viewer-header">
        <span class="photo-viewer-title">${item.name}</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <a class="download-btn" href="${item.data}" download="${item.name}.${isVideo?'webm':'jpg'}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </a>
          <button class="download-btn" onclick="deletePhoto(${index})" style="background:#ef4444;">
            Delete
          </button>
          <button class="photo-viewer-close" onclick="closePhotoViewer()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="photo-viewer-content">
        ${isVideo
          ? `<video src="${item.data}" controls autoplay style="max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.5);"></video>`
          : `<img src="${item.data}" alt="${item.name}">`}
      </div>
    </div>`;
}

function deletePhoto(index) {
  if (!confirm('Delete this item?')) return;
  state.photos.splice(index, 1);
  saveState();
  updatePhotosAppUI();
}

/* ─────────────────────────────────────────────────────────────
   Window Snap Manager — float, halves, quarters, maximize.
   Drag a window to a screen edge to snap; hover the green button
   for the snap-layout flyout; double-click the title bar to toggle.
   ───────────────────────────────────────────────────────────── */
function workArea() {
  const pos = state.dockPosition || 'bottom';
  let top = 0, left = 0, right = window.innerWidth, bottom = window.innerHeight;
  const reserve = 100, m = 8;
  if (pos === 'bottom') bottom -= reserve;
  else if (pos === 'left') left += reserve;
  else if (pos === 'right') right -= reserve;
  return { top: top + m, left: left + m, width: (right - m) - (left + m), height: (bottom - m) - (top + m) };
}

function snapRect(zone) {
  const a = workArea();
  const halfW = a.width / 2, halfH = a.height / 2;
  switch (zone) {
    case 'max':    return { left: a.left,          top: a.top,          width: a.width, height: a.height };
    case 'left':   return { left: a.left,          top: a.top,          width: halfW,   height: a.height };
    case 'right':  return { left: a.left + halfW,  top: a.top,          width: halfW,   height: a.height };
    case 'top':    return { left: a.left,          top: a.top,          width: a.width, height: halfH };
    case 'bottom': return { left: a.left,          top: a.top + halfH,  width: a.width, height: halfH };
    case 'tl':     return { left: a.left,          top: a.top,          width: halfW,   height: halfH };
    case 'tr':     return { left: a.left + halfW,  top: a.top,          width: halfW,   height: halfH };
    case 'bl':     return { left: a.left,          top: a.top + halfH,  width: halfW,   height: halfH };
    case 'br':     return { left: a.left + halfW,  top: a.top + halfH,  width: halfW,   height: halfH };
  }
  return null;
}

function floatWindow(win) {
  const g = win._floatGeom;
  if (g) {
    win.style.width = g.width || '800px';
    win.style.height = g.height || '550px';
    win.style.left = g.left || '120px';
    win.style.top = g.top || '90px';
  }
  win.classList.remove('snapped');
  delete win.dataset.snap;
}

function applySnap(key, zone) {
  const win = activeWindows[key];
  if (!win) return;
  hideSnapFlyout();
  win.style.zIndex = ++zIndexCounter;

  if (zone === 'float') { floatWindow(win); saveState(); return; }

  const r = snapRect(zone);
  if (!r) return;

  // Remember floating geometry the first time we snap
  if (!win.classList.contains('snapped')) {
    win._floatGeom = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
  }
  // Leave fullscreen if it was active
  if (win.classList.contains('fullscreen')) {
    win.classList.remove('fullscreen', 'hide-topbar');
    document.getElementById('mainTopbar').classList.remove('hidden');
    document.getElementById('dock').style.display = 'flex';
    const hz = win.querySelector('.fullscreen-hover-zone');
    if (hz) hz.remove();
  }
  win.classList.add('snapped');
  win.dataset.snap = zone;
  win.style.left = r.left + 'px';
  win.style.top = r.top + 'px';
  win.style.width = r.width + 'px';
  win.style.height = r.height + 'px';
  saveState();
}

function detectSnapZone(x, y, win) {
  const W = window.innerWidth, H = window.innerHeight;
  const CE = 44;   // cursor edge band
  const WE = 10;   // "window edge pinned against screen edge" threshold
  const CC = 100;  // corner region for quarter snaps
  const r = win ? win.getBoundingClientRect() : null;
  const fullW = r ? r.width  >= W - 6 : false;
  const fullH = r ? r.height >= H - 6 : false;

  // Horizontal intent: cursor near an edge OR the window shoved against it.
  // The window-edge trigger is what makes left/right halves (and side-by-side
  // split screen) work without slamming the cursor to the very screen edge.
  let hi = 0; // -1 = left, +1 = right
  if (x <= CE) hi = -1; else if (x >= W - CE) hi = 1;
  if (r && !fullW) {
    if (r.left <= WE) hi = -1;
    else if (r.right >= W - WE) hi = 1;
  }

  // Vertical intent
  let vi = 0; // -1 = top, +1 = bottom
  if (y <= CE) vi = -1; else if (y >= H - CE) vi = 1;
  if (r && !fullH) {
    if (r.top <= WE) vi = -1;
    else if (r.bottom >= H - WE) vi = 1;
  }

  // Quarter only when both intents point somewhere AND the cursor is genuinely
  // in a corner region — otherwise a half wins (halves are the common case).
  const cornerish = (x <= CC || x >= W - CC) && (y <= CC || y >= H - CC);
  if (hi && vi && cornerish) return (vi < 0 ? 't' : 'b') + (hi < 0 ? 'l' : 'r');

  if (hi < 0) return 'left';
  if (hi > 0) return 'right';
  if (vi < 0) return 'max';    // top edge → maximize
  if (vi > 0) return 'bottom';
  return null;
}

function showSnapPreview(zone) {
  const el = document.getElementById('snap-preview');
  if (!zone) { el.classList.remove('visible'); return; }
  const r = snapRect(zone);
  if (!r) { el.classList.remove('visible'); return; }
  el.style.display = 'block';
  el.style.left = r.left + 'px';
  el.style.top = r.top + 'px';
  el.style.width = r.width + 'px';
  el.style.height = r.height + 'px';
  requestAnimationFrame(() => el.classList.add('visible'));
}

function hideSnapPreview() {
  const el = document.getElementById('snap-preview');
  el.classList.remove('visible');
  setTimeout(() => { if (!el.classList.contains('visible')) el.style.display = 'none'; }, 160);
}

// Snap-layout flyout, shown on hover of the green window button
let snapFlyoutTimer = null;
function snapFlyoutHTML(key) {
  const cell = (zone, extra = '') => `<div class="snap-cell" style="${extra}" onclick="applySnap('${key}','${zone}')"></div>`;
  return `
    <div class="snap-group">
      <div class="snap-group-title">Halves</div>
      <div class="snap-row">${cell('left')}${cell('right')}</div>
      <div class="snap-row">${cell('top')}${cell('bottom')}</div>
    </div>
    <div class="snap-group">
      <div class="snap-group-title">Corners</div>
      <div class="snap-quad">${cell('tl')}${cell('tr')}${cell('bl')}${cell('br')}</div>
    </div>
    <div class="snap-group" style="grid-column:1 / -1; grid-template-columns:1fr 1fr;">
      <div class="snap-cell" style="height:30px;background:linear-gradient(180deg,rgba(34,197,94,0.4),rgba(34,197,94,0.2));border-color:rgba(34,197,94,0.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text);" onclick="applySnap('${key}','max')">Maximize</div>
      <div class="snap-cell" style="height:30px;background:linear-gradient(180deg,rgba(148,163,184,0.35),rgba(148,163,184,0.18));border-color:rgba(148,163,184,0.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text);" onclick="applySnap('${key}','float')">Float</div>
    </div>`;
}

function showSnapFlyout(key, btn) {
  const fly = document.getElementById('snap-flyout');
  fly.innerHTML = snapFlyoutHTML(key);
  const rect = btn.getBoundingClientRect();
  fly.style.left = Math.max(8, Math.min(rect.left - 6, window.innerWidth - 232)) + 'px';
  fly.style.top = (rect.bottom + 8) + 'px';
  fly.classList.add('visible');
  if (snapFlyoutTimer) { clearTimeout(snapFlyoutTimer); snapFlyoutTimer = null; }
  fly.onmouseenter = () => { if (snapFlyoutTimer) { clearTimeout(snapFlyoutTimer); snapFlyoutTimer = null; } };
  fly.onmouseleave = hideSnapFlyoutSoon;
}

function hideSnapFlyoutSoon() {
  if (snapFlyoutTimer) clearTimeout(snapFlyoutTimer);
  snapFlyoutTimer = setTimeout(hideSnapFlyout, 180);
}

function hideSnapFlyout() {
  document.getElementById('snap-flyout').classList.remove('visible');
}

window.onload = () => {
  setInterval(updateClock, 1000);
  updateClock();
  checkFirstTime();

  // Init camera when camera window opens (MutationObserver)
  const observer = new MutationObserver(() => {
    if (document.getElementById('camera-video') && !cameraStream) {
      initCameraStream();
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
};
</script>
