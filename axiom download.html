<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #05050a;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, #15152b 0%, #080812 45%, #05050a 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 999999;
    }

    .logo {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #7c5cff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    .status {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .bar {
      width: 220px;
      height: 4px;
      background: #20202c;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #7c5cff, #38bdf8);
      border-radius: inherit;
      animation: loading 1.1s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(500%);
      }
    }

    #error {
      display: none;
      max-width: 500px;
      text-align: center;
      padding: 30px;
    }

    #error h2 {
      margin-top: 0;
    }

    #error button {
      margin-top: 15px;
      border: 0;
      padding: 12px 20px;
      border-radius: 10px;
      background: #6d5dfc;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="loader">
    <div class="logo">axiom</div>
    <div class="status" id="status">Loading Axiom...</div>
    <div class="bar"></div>

    <div id="error">
      <h2>Axiom couldn't load</h2>
      <p id="errorText">
        The latest Axiom version could not be loaded.
      </p>
      <button onclick="location.reload()">Try Again</button>
    </div>
  </div>

  <script>
    const GITHUB_URL =
      "https://cdn.jsdelivr.net/gh/Onex558/Mathisfunallfiles@main/classworkixl.html";

    const FALLBACK_URL =
      "https://cdn.jsdelivr.net/gh/Onex558/uraniumsite@main/index.html";

    const statusText = document.getElementById("status");
    const loader = document.getElementById("loader");
    const errorBox = document.getElementById("error");
    const errorText = document.getElementById("errorText");

    async function getAxiomHTML(url) {
      const response = await fetch(
        url + "?axiom_update=" + Date.now(),
        {
          method: "GET",
          cache: "no-store",
          redirect: "follow"
        }
      );

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      return await response.text();
    }

    function prepareHTML(html, sourceURL) {
      /*
       * Make relative URLs inside Axiom resolve against GitHub.
       * This helps if the Axiom HTML contains things like:
       *
       * src="something.js"
       * href="style.css"
       * src="images/example.png"
       */

      const baseURL =
        sourceURL.substring(
          0,
          sourceURL.lastIndexOf("/") + 1
        );

      const baseTag =
        '<base href="' +
        baseURL +
        '">';

      if (/<head[^>]*>/i.test(html)) {
        html = html.replace(
          /<head([^>]*)>/i,
          "<head$1>" + baseTag
        );
      } else {
        html =
          "<head>" +
          baseTag +
          "</head>" +
          html;
      }

      return html;
    }

    async function loadAxiom() {
      try {
        statusText.textContent =
          "Checking for the latest Axiom...";

        let html;

        try {
          html = await getAxiomHTML(GITHUB_URL);
        } catch (githubError) {
          console.warn(
            "GitHub failed, trying jsDelivr...",
            githubError
          );

          statusText.textContent =
            "Connecting to Axiom CDN...";

          html = await getAxiomHTML(FALLBACK_URL);
        }

        if (!html || html.length < 100) {
          throw new Error(
            "The downloaded Axiom file was empty."
          );
        }

        statusText.textContent =
          "Starting Axiom...";

        html = prepareHTML(
          html,
          GITHUB_URL
        );

        /*
         * Replace this launcher with the actual
         * downloaded Axiom HTML.
         *
         * No Blob URL.
         * No iframe.
         */
        document.open();
        document.write(html);
        document.close();

      } catch (error) {
        console.error(error);

        statusText.style.display = "none";
        document.querySelector(".bar").style.display = "none";

        errorBox.style.display = "block";

        errorText.textContent =
          "Could not download the latest Axiom. " +
          error.message;
      }
    }

    loadAxiom();
  </script>

</body>
</html>
